name: Add meal from GitHub Issue

on:
  push:
    branches: [main]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: meal-log-main
  cancel-in-progress: false

jobs:
  add-meal:
    # Only accept submissions from the repository owner; public visitors cannot edit the tracker.
    if: github.event.issue.user.login == 'DeFranzo' && startsWith(github.event.issue.title, '[Meal Log] ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate and append meal
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/add_meal.py
      - name: Commit nutrition update
        run: |
          if git diff --quiet -- meals.json; then
            echo "Meal already recorded."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add meals.json
            git commit -m "Log meal from issue #${{ github.event.issue.number }}"
            git push origin HEAD:main
          fi
      - name: Close submitted issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue close "$ISSUE_URL" --comment "Meal added to meals.json. GitHub Pages will update after deployment."

  deploy:
    needs: add-meal
    if: always() && (github.event_name == 'push' || needs.add-meal.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
